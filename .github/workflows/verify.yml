name: Verify VM assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates cpio curl file git jq kmod libarchive-tools pipx \
            python3 python3-venv qemu-system-arm rsync shellcheck squashfs-tools unzip \
            xz-utils zip zstd
          docker version

      - name: Check source and license metadata
        run: |
          shellcheck \
            script/make_vm_assets \
            script/make_source_bundle \
            script/initramfs/*
          pipx run --spec 'reuse==5.1.1' reuse lint
          python3 -m compileall -q compliance script
          ./script/make_vm_assets --self-test
          python3 script/update_dependencies.py --self-test
          python3 -m unittest discover -s compliance/tests -v

      - name: Build locked VM assets
        run: |
          ./script/make_vm_assets \
            --config config/alpine.env \
            --lock config/packages.lock.json \
            --output build

      - name: Build corresponding-source archive
        run: |
          ./script/make_source_bundle \
            --lock config/packages.lock.json \
            --build-dir build \
            --output build/release/vm_assets-sources.tar.zst

      - name: Build compliance payload and binary archive
        run: |
          python3 compliance/build_compliance.py \
            --lock config/packages.lock.json \
            --build-dir build \
            --asset-dir build/assets

      - name: Verify distribution and corresponding source
        run: |
          python3 compliance/verify_compliance.py \
            --lock config/packages.lock.json \
            --build-dir build \
            --asset-dir build/assets \
            --source-bundle build/release/vm_assets-sources.tar.zst

      - name: Smoke-test aarch64 boot
        shell: bash
        run: |
          set -o pipefail
          set +e
          timeout --signal=TERM 45s qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a57 \
            -smp 2 \
            -m 512M \
            -nographic \
            -no-reboot \
            -kernel build/assets/Image-lts \
            -initrd build/assets/initramfs-rtpvm-lts \
            -append "console=ttyAMA0 rdinit=/sbin/init panic=-1" \
            2>&1 | tee build/qemu-smoke.log
          qemu_status=${PIPESTATUS[0]}
          set -e

          if [[ $qemu_status -ne 0 && $qemu_status -ne 124 ]]; then
            echo "QEMU exited unexpectedly with status $qemu_status" >&2
            exit "$qemu_status"
          fi

          grep -Fq "rtpvm-rcS: early boot setup finished" build/qemu-smoke.log

      - name: Confirm build did not change tracked inputs
        run: git diff --exit-code

      # Intentionally no upload-artifact step: CI verifies but does not
      # distribute binaries. Only the manual release workflow publishes them.
