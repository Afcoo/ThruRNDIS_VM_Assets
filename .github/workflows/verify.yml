name: Verify changes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
      manifest_changed: ${{ steps.changes.outputs.manifest_changed }}
      manifests: ${{ steps.changes.outputs.manifests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: changes
        run: python3 script/verify_download_manifests.py plan --plan "$RUNNER_TEMP/verification-plan.json"

  vm-assets:
    name: Verify VM assets
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    uses: ./.github/workflows/verify-vm-assets.yml

  download-manifests:
    name: Verify download manifests
    needs: changes
    if: needs.changes.outputs.manifest_changed == 'true'
    uses: ./.github/workflows/verify-download-manifests.yml
    with:
      manifests: ${{ needs.changes.outputs.manifests }}

  # Keep the branch-protection check stable. An expected skip is allowed, but
  # failed classification or a failed/cancelled/missing required job is not.
  verify:
    if: always()
    needs: [changes, vm-assets, download-manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected verifications to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build_required }}
          MANIFEST_CHANGED: ${{ needs.changes.outputs.manifest_changed }}
          VM_RESULT: ${{ needs.vm-assets.result }}
          MANIFEST_RESULT: ${{ needs.download-manifests.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == success ]] || {
            echo "Change classification did not succeed: $CHANGES_RESULT" >&2
            exit 1
          }
          [[ "$BUILD_REQUIRED" == true || "$MANIFEST_CHANGED" == true ]] || {
            echo "No verification was selected" >&2
            exit 1
          }
          require_result() {
            local required=$1 result=$2 label=$3
            if [[ "$required" == true && "$result" == success ]] || \
               [[ "$required" == false && "$result" == skipped ]]; then
              printf '%s: %s\n' "$label" "$result"
            else
              printf '%s did not meet its verification requirement (required=%s, result=%s)\n' \
                "$label" "$required" "$result" >&2
              exit 1
            fi
          }
          require_result "$BUILD_REQUIRED" "$VM_RESULT" "VM assets"
          require_result "$MANIFEST_CHANGED" "$MANIFEST_RESULT" "Download manifests"
