# Publish the guest's live RNDIS IPv4 and DNS-SD discovery service. BusyBox init
# keeps Avahi in the foreground; Avahi follows usb0 appearance and address changes
# independently of optional port forwarding.
[server]
host-name=thrurndis
host-name-from-machine-id=no
domain-name=local
use-ipv4=yes
use-ipv6=no
allow-interfaces=usb0
# usb0-watcher already owns carrier detection and teardown. Do not depend on
# RNDIS drivers implementing IFF_RUNNING consistently.
use-iff-running=no
enable-dbus=no
disallow-other-stacks=yes
allow-point-to-point=no

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=no
# Restricts D-Bus clients; the repository-owned static service is still loaded.
disable-user-service-publishing=yes
add-service-cookie=no
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-resolv-conf-dns-servers=no

[reflector]
enable-reflector=no
